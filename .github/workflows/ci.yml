name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Vela.Avalonia.slnx

      - name: Build (Release)
        run: dotnet build Vela.Avalonia.slnx -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/Vela.Avalonia.Tests/Vela.Avalonia.Tests.csproj -c Release --no-build --verbosity normal

      - name: Run Headless Performance & Leak Tests
        run: dotnet test tests/Vela.Avalonia.HeadlessTests/Vela.Avalonia.HeadlessTests.csproj -c Release --no-build --verbosity normal

      - name: Pack NuGet Packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/Vela.Avalonia/Vela.Avalonia.csproj -c Release --no-build -o ./artifacts
          dotnet pack src/Vela.Avalonia.Charts/Vela.Avalonia.Charts.csproj -c Release --no-build -o ./artifacts

      - name: Upload NuGet Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: vela-avalonia-nupkgs
          path: ./artifacts/*.nupkg
