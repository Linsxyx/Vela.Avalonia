name: Release & Publish NuGet

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION#v}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Vela.Avalonia.slnx

      - name: Build (Release)
        run: dotnet build Vela.Avalonia.slnx -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: Run Unit Tests
        run: dotnet test tests/Vela.Avalonia.Tests/Vela.Avalonia.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack NuGet Packages
        run: |
          dotnet pack src/Vela.Avalonia/Vela.Avalonia.csproj -c Release --no-build -p:Version=${{ steps.ver.outputs.version }} -o ./artifacts
          dotnet pack src/Vela.Avalonia.Charts/Vela.Avalonia.Charts.csproj -c Release --no-build -p:Version=${{ steps.ver.outputs.version }} -o ./artifacts
          ls -la ./artifacts

      - name: Push to NuGet.org
        if: ${{ secrets.NUGET_API_KEY != '' }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
