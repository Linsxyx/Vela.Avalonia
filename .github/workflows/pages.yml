name: Deploy Gallery to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: |
          dotnet --version
          dotnet workload install wasm-tools

      - name: Publish Browser Gallery (WebAssembly)
        run: dotnet publish samples/Vela.Avalonia.Gallery.Browser/Vela.Avalonia.Gallery.Browser.csproj -c Release

      - name: Prepare GitHub Pages static bundle
        run: |
          BUNDLE="samples/Vela.Avalonia.Gallery.Browser/bin/Release/net10.0-browser/publish/wwwroot"
          if [ ! -d "$BUNDLE" ]; then
            echo "Published wwwroot bundle not found at $BUNDLE"
            exit 1
          fi
          # Prevent Jekyll from stripping the _framework directory
          touch "$BUNDLE/.nojekyll"
          ls -la "$BUNDLE"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: samples/Vela.Avalonia.Gallery.Browser/bin/Release/net10.0-browser/publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
